name: Keep Render Alive

on:
  schedule:
    - cron: "*/5 * * * *"   # mỗi 5 phút
  workflow_dispatch:        # cho phép chạy tay

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render server
        run: |
          echo "Pinging server..."
          curl -s -o /dev/null -w "%{http_code}" https://shortlink-be-yji2.onrender.com/actuator/health
